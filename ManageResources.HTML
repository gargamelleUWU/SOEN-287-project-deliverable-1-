<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resource Manager</title>
</head>

<body>
    <header></header>

    <div>
        <h1>Resource Manager</h1>
        <pr>Create, manage, edit, or cancel bookings</pr>
    </div>

    <div>
        <h3>Create New Resource</h3>
        <label>Resource Type</label>
        <select>
            <option value="studyroom">Study Room</option>
            <option value="complab">Computer Lab</option>
            <option value="sportscourt">Sport Court</option>
        </select>
        <br>

        <label>Location</label>
        <select>
            <option value="EV">EV Building</option>
            <option value="Hall">Hall Building</option>
            <option value="John Molson">John Molsong Building</option>
        </select>
        <br>

        <label>Room</label>
        <input type="text" id="room" name="room" placeholder="Enter the time">
        <br>

        <label>Start Time</label>
        <select>
            <option value="eightAM">8:00 AM</option>
            <option value="nineAM">9:00 AM</option>
            <option value="ten">10:00 AM</option>
            <option value="eleven">11:00 AM</option>
            <option value="twelve">12:00 PM</option>
            <option value="one">1:00 PM</option>
            <option value="two">2:00 PM</option>
            <option value="three">3:00 PM</option>
            <option value="four">4:00 PM</option>
            <option value="five">5:00 PM</option>
            <option value="six">6:00 PM</option>
            <option value="seven">7:00 PM</option>
            <option value="eight">8:00 PM</option>
            <option value="nine">9:00 PM</option>
        </select>
        <br>

        <label>Duration</label>
        <select>
            <option value="onehour">1 hour</option>
            <option value="twohours">2 hours</option>
            <option value="threehours">3 hours</option>
        </select>
        <br>
        <button>+ Create Event</button>
    </div>
</body>

</html>
