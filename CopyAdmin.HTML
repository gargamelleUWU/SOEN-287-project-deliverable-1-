<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Copy Admin · University Resource Booking</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
</head>
<body>
<header class="site-header">
    <div class="wrap header-row">
        <a href="index.html" class="logo"><img src="assets/logo-concordia.svg" alt="Logo"></a>
        <nav class="main-nav">
            <a href="index.html">Home</a>
            <a href="BrowseResources.html">Resources</a>
            <a href="BookingDashboard.html">Bookings</a>
            <a href="AdminDashboard.html">Admin</a>
            <div class="more">
                <button class="more-btn" type="button">More</button>
                <div class="more-menu">
                    <a href="ResourceSearch.html">Search</a>
                    <a href="ManageResources.html">Manage Resources</a>
                    <a href="Statistics.html">Statistics</a>
                    <a href="calendar.html">Calendar</a>
                    <a class="active" href="CopyAdmin.html">Copy Admin</a>
                    <a href="about.html">About</a>
                    <a href="login.html">Login / Signup</a>
                </div>
            </div>
        </nav>
        <div class="header-cta"><a class="btn-pill" href="login.html">Login</a></div>
    </div>
</header>

<main>
    <section class="section wrap" style="max-width:800px;">
        <h1 class="section-title">Copy & Content Admin</h1>
        <p class="section-sub">Edit key text sections of the site (hero titles, footer notes, etc.).</p>

        <div class="card">
            <form>
                <div class="field">
                    <label class="label">Homepage Hero Title</label>
                    <input class="input" type="text" placeholder="e.g., Book Your Study Space Instantly" />
                </div>
                <div class="field">
                    <label class="label">Homepage Hero Subtitle</label>
                    <textarea class="input" rows="3" placeholder="e.g., Browse rooms, labs, and courts across campus."></textarea>
                </div>
                <div class="field">
                    <label class="label">Footer Message</label>
                    <textarea class="input" rows="2" placeholder="e.g., © 2024 University Resources. All rights reserved."></textarea>
                </div>

                <div class="actions">
                    <button class="btn btn-primary" type="button" onclick="alert('Changes saved (demo).')">Save</button>
                    <button class="btn" type="reset">Reset</button>
                </div>
            </form>
        </div>
    </section>
</main>

<footer class="site-footer">
    <div class="container">
        <div class="divider"></div>
        <div class="footer-bottom"><div class="copyright">© <span id="year"></span> University Resources</div></div>
    </div>
</footer>
</body>
</html>
