<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Create account · University Resources</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">Logo</div>
      <nav class="navlinks" aria-label="Primary">
        <a href="#">Home</a>
        <a href="#">Resources</a>
        <a href="#">Bookings</a>
        <a href="#">Admin</a>
        <a href="#">More</a>
      </nav>
      <div class="nav-right">
        <span class="pill">Login</span>
      </div>
    </header>

    <main class="main">
      <div class="content-col center-col">
        <div class="logo-and-card">
          <div class="logo-center">Logo</div>
          <section class="card" role="form" aria-labelledby="signup-title">
            <h1 id="signup-title" class="title">Create your account</h1>
            <p class="subtitle">Register to access university resources</p>

            <form action="#" method="post" novalidate>
              <div class="field">
                <label class="label" for="fullName">Full name</label>
                <input id="fullName" name="fullName" type="text" class="input" placeholder="Jane Doe" required>
              </div>

              <div class="field">
                <label class="label" for="email">Email</label>
                <input id="email" name="email" type="email" autocomplete="email" class="input" placeholder="name@university.edu" required>
              </div>

              <div class="field">
                <label class="label" for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="new-password" class="input" placeholder="At least 8 characters" required>
              </div>

              <div class="field">
                <label class="label" for="confirm">Confirm password</label>
                <input id="confirm" name="confirm" type="password" autocomplete="new-password" class="input" placeholder="Repeat your password" required>
              </div>

              <button class="btn btn-primary mt-12" type="submit">Create account</button>

              <div class="divider mt-12">or sign up with</div>

              <button type="button" class="btn btn-ghost mt-8" aria-label="Sign up with Google">
                <span class="icon icon-google" aria-hidden="true"></span>
                Continue with Google
              </button>
              <button type="button" class="btn btn-ghost mt-8" aria-label="Sign up with Facebook">
                <span class="icon icon-facebook" aria-hidden="true"></span>
                Continue with Facebook
              </button>
              <button type="button" class="btn btn-ghost mt-8" aria-label="Sign up with Apple">
                <span class="icon icon-apple" aria-hidden="true"></span>
                Continue with Apple
              </button>

              <p class="text-center mt-16">Already have an account? <a href="login.html">Log in</a></p>
            </form>
          </section>
        </div>
      </div>
    </main>

    <footer>© 2024 University Resources</footer>
  </div>
</body>
</html>
