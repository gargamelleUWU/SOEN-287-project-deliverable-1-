<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Search Resources · University Resource Booking</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
</head>
<body>
<!-- Header -->
<header class="site-header">
    <div class="wrap header-row">
        <a href="index.html" class="logo">
            <img src="assets/logo-concordia.svg" alt="Logo">
        </a>
        <nav class="main-nav" aria-label="Primary">
            <a href="index.html">Home</a>
            <a href="BrowseResources.html">Resources</a>
            <a href="BookingDashboard.html">Bookings</a>
            <a href="AdminDashboard.html">Admin</a>

            <div class="more">
                <button class="more-btn" type="button" aria-haspopup="true" aria-expanded="false">More</button>
                <div class="more-menu" role="menu">
                    <a class="active" href="ResourceSearch.html" role="menuitem">Search</a>
                    <a href="ManageResources.html" role="menuitem">Manage Resources</a>
                    <a href="Statistics.html" role="menuitem">Statistics</a>
                    <a href="calendar.html" role="menuitem">Calendar</a>
                    <a href="CopyAdmin.html" role="menuitem">Copy Admin</a>
                    <a href="about.html" role="menuitem">About</a>
                    <a href="login.html" role="menuitem">Login / Signup</a>
                </div>
            </div>
        </nav>
        <div class="header-cta"><a class="btn-pill" href="login.html">Login</a></div>
    </div>
</header>

<main>
    <section class="section wrap" style="max-width:980px;">
        <h1 class="section-title">Search resources</h1>
        <p class="section-sub">Live filter by name, type, or location. New items added in “Manage Resources” appear here (same session).</p>

        <!-- Search controls -->
        <div class="card">
            <div class="grid-3">
                <div class="field">
                    <label class="label" for="qText">Search</label>
                    <input id="qText" class="input" type="text" placeholder="e.g., EV301, Lab, Loyola" />
                </div>
                <div class="field">
                    <label class="label" for="qType">Type</label>
                    <select id="qType" class="input">
                        <option value="">Any</option>
                        <option>Study Room</option>
                        <option>Computer Lab</option>
                        <option>Sports Court</option>
                    </select>
                </div>
                <div class="field">
                    <label class="label" for="qLoc">Location</label>
                    <input id="qLoc" class="input" type="text" placeholder="EV, Hall, Loyola" />
                </div>
            </div>
        </div>

        <!-- Results -->
        <div id="results" class="cards-3" style="margin-top:14px;"></div>
        <p id="noResults" class="muted" style="display:none;">No results found.</p>
    </section>
</main>

<footer class="site-footer">
    <div class="container">
        <div class="divider"></div>
        <div class="footer-bottom">
            <div class="copyright">© <span id="year"></span> University Resources</div>
        </div>
    </div>
</footer>

<script>
    // Use the same session data as ManageResources (or init defaults)
    window.tempResources = window.tempResources || [
        { name: "Study Room EV301", type: "Study Room", location: "EV", capacity: 6, status: "Open", img: "assets/university_study_room_.jpg" },
        { name: "Computer Lab 916", type: "Computer Lab", location: "Hall", capacity: 32, status: "Open", img: "assets/hero-office.jpg" },
        { name: "Sports Court L107", type: "Sports Court", location: "Loyola", capacity: 100, status: "Open", img: "assets/university_study_room_.jpg" }
    ];

    // Ensure images exist on objects (fallback if created via ManageResources)
    function normalize(resources) {
        return resources.map(r => ({
            img: r.img || (r.type === 'Computer Lab' ? 'assets/hero-office.jpg' : 'assets/university_study_room_.jpg'),
            ...r
        }));
    }

    const resultsEl = document.getElementById('results');
    const noResults = document.getElementById('noResults');
    const qText = document.getElementById('qText');
    const qType = document.getElementById('qType');
    const qLoc  = document.getElementById('qLoc');

    function render(list) {
        resultsEl.innerHTML = '';
        if (list.length === 0) {
            noResults.style.display = '';
            return;
        }
        noResults.style.display = 'none';

        normalize(list).forEach(r => {
            const card = document.createElement('article');
            card.className = 'card';
            card.innerHTML = `
          <div class="card-media"><img src="${r.img}" alt="${r.name}"></div>
          <div class="card-body">
            <div class="eyebrow">${r.type}</div>
            <h3>${r.name}</h3>
            <p class="muted">${r.location} · Capacity ${r.capacity} · ${r.status}</p>
            <div class="card-actions">
              <a class="btn btn-primary" href="index.html">Book via Homepage</a>
              <a class="btn" href="ResourceDetails.html">Details</a>
            </div>
          </div>
        `;
            resultsEl.appendChild(card);
        });
    }

    function filter() {
        const t = (qText.value || '').toLowerCase();
        const ty = (qType.value || '').toLowerCase();
        const l = (qLoc.value || '').toLowerCase();

        const out = window.tempResources.filter(r => {
            const str = (r.name + ' ' + r.location).toLowerCase();
            const okTxt = !t || str.includes(t);
            const okType = !ty || (r.type || '').toLowerCase() === ty;
            const okLoc = !l || (r.location || '').toLowerCase().includes(l);
            return okTxt && okType && okLoc;
        });

        render(out);
    }

    // Wire up live search
    qText.addEventListener('input', filter);
    qType.addEventListener('change', filter);
    qLoc.addEventListener('input', filter);

    // First render
    render(window.tempResources);
</script>
</body>
</html>
