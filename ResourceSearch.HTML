<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resource Browser</title>
    <link rel="stylesheet" href="Styles.css">
</head>

<body>
    <header>
        <nav class="navbar">
            <a href="AdminDashboard.HTML">Dashboard</a>
            <a href="ManageResources.HTML">Manage Resources</a>
            <a href="BookingRequest.HTML">Booking Requests</a>
            <a href="Statistics.HTML">User Statistics</a>
            <a href="ResourceSearch.HTML">Resource Browser</a>
            <input class="left" type="search" searchbar="Browse Resources">
            <a href="ResourceSearch.HTML">
                <button class="button">Search</button>
            </a>
            <button class="left">Login</button>
        </nav>
    </header>

    <div>
        <h1 class="title">Resource Browser</h1>
        <p class="subtitle">Browse for resources</p>
    </div>
    <div>
        <input type="search" placeholder="Search resources">
        <button type="button">Search</button>
    </div>

    <div>
        <button type="button" class="tag">Study Room</button>
        <button type="button" class="tag">Labs</button>
        <button type="button" class="tag">Sports</button>
        <button type="button" class="tag">Blocked</button>
        <button type="button" class="tag">Available</button>
        <button type="button" class="tag">EV</button>
        <button type="button" class="tag">Hall</button>
    </div>

    <div>
        <label for="filter-date">Date:</label>
        <input type="date" id="filter-date">

        <label for="filter-time">Time:</label>
        <input type="time" id="filter-time">

        <label for="filter-location">Location:</label>
        <input type="text" id="filter-location" placeholder="Enter location">
    </div>

    <div class="resource-container">
        <div class="resource-box">
            <p>Type</p>
            <p>Location</p>
            <p>Time</p>
            <p>Date</p>
            <p>Status</p>
            <p>Student</p>

            <div class="options">
                <button type="button">Edit</button>
                <button type="button">Block</button>
                <button type="button">Cancel</button>
                <button type="button">Delete</button>
            </div>
        </div>
</body>

</html>
